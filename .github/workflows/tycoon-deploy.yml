name: Deploy 교실 국가 타이쿤 to Firebase Hosting

# tycoon/ 폴더가 바뀐 채로 main 에 push 되면 그 앱만 배포합니다.
# (같은 저장소의 다른 앱들과 완전히 분리된 별도 배포)
on:
  push:
    branches: [main]
    paths:
      - 'tycoon/**'
      - '.github/workflows/tycoon-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tycoon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: 단위 테스트
        run: npm run test

      - name: 빌드
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.TYCOON_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.TYCOON_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.TYCOON_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.TYCOON_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.TYCOON_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.TYCOON_FIREBASE_APP_ID }}
          VITE_USE_EMULATOR: ''
        run: npm run build

      - name: Firebase Hosting 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYCOON }}
          projectId: ${{ secrets.TYCOON_FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: ./tycoon
