<title>콘텐츠 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* 작업대 레이아웃: 왼쪽은 주문서(입력), 오른쪽은 결과물 묶음(탭). 좁은 화면에서는 위아래로 쌓인다. */
  :root {
    --bg: #f2f4f8;
    --surface: #ffffff;
    --sunken: #e8ecf3;
    --ink: #172031;
    --muted: #5a6476;
    --line: #d7dde7;
    --accent: #2f5bd3;
    --accent-ink: #ffffff;
    --seal: #c23b2a;
    --ok: #2b7a4b;
    --warn: #9a6200;
    --font-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141d; --surface: #171e2b; --sunken: #1f2838; --ink: #e5e9f1; --muted: #9ba5b7; --line: #2b3546;
      --accent: #7d9cf2; --accent-ink: #0f141d; --seal: #ec7a68; --ok: #63c08c; --warn: #e3b25a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141d; --surface: #171e2b; --sunken: #1f2838; --ink: #e5e9f1; --muted: #9ba5b7; --line: #2b3546;
    --accent: #7d9cf2; --accent-ink: #0f141d; --seal: #ec7a68; --ok: #63c08c; --warn: #e3b25a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 머리글 */
  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
  .top h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; }
  .top p { margin: 4px 0 0; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
  .flow li { display: flex; align-items: center; gap: 6px; }
  .flow li + li::before { content: "→"; color: var(--line); }
  .flow b { color: var(--ink); font-weight: 600; }

  .bench { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 880px) { .bench { grid-template-columns: minmax(0, 1fr); } }

  /* 주문서 */
  .order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
  @media (max-width: 880px) { .order { position: static; } }
  .order h2 { font-size: 16px; font-weight: 600; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label, .field legend { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
  .field input[type="text"], .field input[type="number"], .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; }
  fieldset.field { border: 0; margin: 0; padding: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg label { display: block; text-align: center; padding: 7px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink); letter-spacing: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
  .check input { margin-top: 3px; accent-color: var(--accent); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 11px 16px; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { color: var(--ink); border-color: var(--line); }

  .status { border-radius: 8px; background: var(--sunken); padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; }
  .status .line { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .status .meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .status .meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s; }
  .status.error { background: color-mix(in srgb, var(--seal) 12%, var(--surface)); color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); margin: 0; }

  .recent { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
  .recent h3 { font-size: 13px; font-weight: 600; color: var(--muted); }
  .recent ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .recent button { width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .recent button:hover, .recent button[aria-current="true"] { background: var(--sunken); }
  .recent button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .recent time { color: var(--muted); font-family: var(--font-mono); font-size: 12px; flex: none; }

  /* 결과물 */
  .kit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
  .kit-head { padding: 18px 20px 0; display: grid; gap: 10px; }
  .kit-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .kit-title h2 { font-family: var(--font-display); font-size: 22px; line-height: 1.35; min-width: 0; }
  .badge { font-size: 12px; font-weight: 600; border: 1px solid var(--seal); color: var(--seal); border-radius: 4px; padding: 0 6px; letter-spacing: 0.04em; }
  .kit-meta { color: var(--muted); font-size: 13px; margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; padding-inline: 12px; margin-top: 6px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 10px 9px; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 500; font-size: 14px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs .count { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; color: var(--muted); }
  .panel { padding: 20px; min-width: 0; }

  .paper { background: var(--sunken); border-radius: 8px; padding: 16px; overflow-x: auto; }
  .paper-host { background: #ffffff; color: #1d2433; border-radius: 4px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); padding-inline: 24px; max-width: 820px; margin: 0 auto; }
  @media (max-width: 600px) { .panel { padding: 14px; } .paper { padding: 6px; } .paper-host { padding-inline: 0; } }
  .howto { margin: 0 0 12px; font-size: 13px; color: var(--muted); }

  .stack { display: grid; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-head h3 { font-size: 15px; font-weight: 600; }
  .kv { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; }
  .kv dt { font-size: 13px; color: var(--muted); padding-top: 2px; }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 520px) { .kv { grid-template-columns: minmax(0, 1fr) auto; } .kv dt { grid-column: 1 / -1; padding-top: 0; } }
  .price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--seal); border: 1.5px solid var(--seal); border-radius: 4px; padding: 1px 8px; font-size: 15px; display: inline-block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { background: var(--sunken); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 6px; padding: 12px 14px; font-size: 14px; max-height: 420px; overflow-y: auto; }
  .scenes { width: 100%; border-collapse: collapse; font-size: 14px; }
  .scenes th, .scenes td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  .scenes th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .scenes td:first-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }

  .progress { display: flex; align-items: center; gap: 12px; }
  .progress .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; background: var(--ok); transition: width 0.3s; }
  .progress b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
  .ready { color: var(--ok); font-weight: 600; }
  .checklist h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .checklist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .checklist label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .checklist label:hover { background: var(--bg); }
  .checklist input { margin-top: 4px; accent-color: var(--ok); width: 16px; height: 16px; }
  .checklist small { display: block; color: var(--muted); font-size: 12.5px; }
  .checklist input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .fact { border-left: 3px solid var(--warn); padding-left: 10px; }

  .empty { color: var(--muted); padding: 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 10; max-width: calc(100% - 32px); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>콘텐츠 스튜디오</h1>
      <p>주제 하나로 판매용 수업 자료와 판매·홍보 문구를 함께 만듭니다.</p>
    </div>
    <ol class="flow" aria-label="판매까지의 순서">
      <li><b>만들기</b></li>
      <li>체크리스트 검토</li>
      <li>PDF 저장</li>
      <li>판매처 등록</li>
      <li>정산 계좌로 입금</li>
    </ol>
  </header>

  <div class="bench">
    <form class="order" id="order" novalidate>
      <h2>무엇을 만들까요?</h2>
      <div class="field">
        <label for="topic">주제</label>
        <input type="text" id="topic" name="topic" placeholder="예: 조선 후기 실학의 등장" required maxlength="120" autocomplete="off">
      </div>
      <div class="row">
        <div class="field">
          <label for="grade">대상</label>
          <input type="text" id="grade" name="grade" value="중학교 2학년" list="grades" maxlength="40">
          <datalist id="grades">
            <option value="중학교 1학년"></option><option value="중학교 2학년"></option><option value="중학교 3학년"></option>
            <option value="고등학교 1학년"></option><option value="고등학교 2학년"></option><option value="고등학교 3학년"></option>
          </datalist>
        </div>
        <div class="field">
          <label for="questions">문항 수</label>
          <input type="number" id="questions" name="questions" value="10" min="3" max="20">
        </div>
      </div>
      <fieldset class="field">
        <legend>유형</legend>
        <div class="seg">
          <label><input type="radio" name="type" id="type-lesson" value="lesson-pack" checked>교사용 수업 자료</label>
          <label><input type="radio" name="type" id="type-study" value="study-guide">학생용 자습 노트</label>
        </div>
      </fieldset>
      <div class="field">
        <label for="platforms">판매처 <span class="note">(쉼표로 구분)</span></label>
        <input type="text" id="platforms" name="platforms" value="크몽, 자체 판매 페이지(블로그·스마트스토어)" maxlength="160">
      </div>
      <div class="field">
        <label for="note">추가 요청</label>
        <textarea id="note" name="note" rows="2" maxlength="400" placeholder="예: 사료 읽기 활동 1개 포함"></textarea>
      </div>
      <div class="field">
        <label for="author">자료에 넣을 저작권 표시</label>
        <input type="text" id="author" name="author" placeholder="예: 동쌤" maxlength="40">
      </div>
      <label class="check" for="careful"><input type="checkbox" id="careful" name="careful">꼼꼼 모드 — 더 깊이 생각해서 만듭니다. 몇 분 더 걸립니다.</label>

      <button class="btn primary" type="submit" id="go">자료 만들기</button>
      <div class="status" id="status" hidden>
        <div class="line"><span id="status-text"></span><button type="button" class="btn small quiet" id="stop" hidden>멈추기</button></div>
        <div class="meter" id="meter"><i></i></div>
      </div>
      <p class="note" id="availability">claude.ai에서 이 화면을 열면 내 Claude 계정으로 자료를 만듭니다. 처음 만들 때 사용 허락을 묻습니다.</p>

      <div class="recent" id="recent" hidden>
        <h3>최근 만든 자료</h3>
        <ul id="recent-list"></ul>
      </div>
    </form>

    <section class="kit" id="kit" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<!-- APP_SCRIPT -->
